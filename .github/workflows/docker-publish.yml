
name: Docker Build, Publish and Deploy

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build production image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and validate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: false
          tags: restaurant-web-app:ci

  publish:
    name: Publish image to Docker Hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        shell: bash
        run: echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            zohaibkhanse/restaurant-web-app-docker:latest
            zohaibkhanse/restaurant-web-app-docker:${{ steps.meta.outputs.image_tag }}

  deploy:
    name: Deploy to AWS EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest

    environment: production

    env:
      DEV_HOST: ${{ secrets.DEV_HOST }}
      IMAGE: zohaibkhanse/restaurant-web-app-docker:${{ needs.publish.outputs.image_tag }}

    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2_rsa_key
          chmod 600 ~/.ssh/ec2_rsa_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          cat > ~/.ssh/askpass.sh <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_PASSPHRASE"
          EOF
          chmod 700 ~/.ssh/askpass.sh

          eval "$(ssh-agent -s)"

          export SSH_ASKPASS="$HOME/.ssh/askpass.sh"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0

          setsid ssh-add ~/.ssh/ec2_rsa_key < /dev/null

          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      
      - name: Deploy image to EC2
        shell: bash
        run: |
          set -euo pipefail

          ssh ubuntu@"$DEV_HOST" \
            "IMAGE='$IMAGE' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          APP=restaurant-web-app
          CANDIDATE=restaurant-web-app-candidate
          BACKUP=restaurant-web-app-rollback
          PORT=80

          echo "Pulling production image: $IMAGE"
          sudo docker pull "$IMAGE"

          # Remember the current production image before changing anything.
          PREVIOUS_IMAGE=""
          if sudo docker container inspect "$APP" >/dev/null 2>&1; then
            PREVIOUS_IMAGE=$(sudo docker inspect \
              --format='{{.Config.Image}}' "$APP")
            echo "Previous image: $PREVIOUS_IMAGE"
          fi

          # Remove stale candidate containers from earlier attempts.
          sudo docker rm -f "$CANDIDATE" 2>/dev/null || true

          # Test the new image on a temporary, localhost-only port.
          echo "Starting candidate container"
          sudo docker run -d \
            --name "$CANDIDATE" \
            -p 127.0.0.1:8081:80 \
            "$IMAGE"

          CANDIDATE_OK=false
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8081/ >/dev/null; then
              CANDIDATE_OK=true
              break
            fi
            sleep 2
          done

          if [ "$CANDIDATE_OK" != true ]; then
            echo "Candidate health check failed"
            sudo docker logs "$CANDIDATE" || true
            sudo docker rm -f "$CANDIDATE" || true
            exit 1
          fi

          # Stop the candidate and free its temporary port.
          sudo docker rm -f "$CANDIDATE"

          # Preserve the previous container until the new one is healthy.
          sudo docker rm -f "$BACKUP" 2>/dev/null || true
          if sudo docker container inspect "$APP" >/dev/null 2>&1; then
            sudo docker rename "$APP" "$BACKUP"
            sudo docker stop "$BACKUP" >/dev/null || true
          fi

          # Start the new production container.
          if ! sudo docker run -d \
            --name "$APP" \
            --restart unless-stopped \
            -p 80:80 \
            "$IMAGE"; then
            echo "New production container failed to start"
            sudo docker rm -f "$APP" 2>/dev/null || true

            if [ -n "$PREVIOUS_IMAGE" ]; then
              sudo docker rename "$BACKUP" "$APP"
              sudo docker start "$APP"
            fi
            exit 1
          fi

          # Verify production before discarding the previous container.
          PRODUCTION_OK=false
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1/ >/dev/null; then
              PRODUCTION_OK=true
              break
            fi
            sleep 2
          done

          if [ "$PRODUCTION_OK" != true ]; then
            echo "Production health check failed; rolling back"
            sudo docker logs "$APP" || true
            sudo docker rm -f "$APP" || true

            if [ -n "$PREVIOUS_IMAGE" ]; then
              sudo docker rename "$BACKUP" "$APP"
              sudo docker start "$APP"

              for attempt in $(seq 1 15); do
                if curl -fsS http://127.0.0.1/ >/dev/null; then
                  echo "Rollback successful; previous application restored"
                  exit 1
                fi
                sleep 2
              done

              echo "Rollback container did not pass its health check"
            else
              echo "No previous production container was available"
            fi

            exit 1
          fi

          echo "Production deployment successful"
          sudo docker rm -f "$BACKUP" 2>/dev/null || true
          REMOTE
